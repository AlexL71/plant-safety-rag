[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-rag"
version = "0.1.0"
description = "Bilingual (EN/KO) question answering over plant process-safety standards, with clause-level citations"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
