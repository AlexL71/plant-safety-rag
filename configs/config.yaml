# All tunable settings live here. Paths are relative to the repo root.
# Sections for chunking, retrieval and evaluation are added in their phases.

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  manifest: data/manifest.csv
  index_dir: index
  embedding_cache: index/embedding_cache.sqlite
  llm_cache_dir: cache/llm

ingest:
  space_gap_ratio: 0.15               # insert a space where the gap between two characters > ratio x font size
  page_number_rows: 2                 # page numbers are removed only in the first/last N rows of a page
  header_edge_rows: 3                 # only the first/last N rows can be running headers/footers
  header_repeat_min_pages: 3          # repeats needed (same text, same height); the very first/last row needs only 2
  header_repeat_ratio: 0.25           # digit-normalized repeats (e.g. "Frm 00360") also need this share of pages
  edge_line_patterns:                 # known running heads/footers, removed in the edge rows only (short CFR files)
    - '^\d+ CFR Ch\. [IVXLC]+ \(\d+[–-]\d+[–-]\d+ Edition\)$'   # "29 CFR Ch. XVII (7–1–25 Edition)"
    - '^Occu\. Safety and Health Admin\., Labor$'
    - '^Frm \d+$'
    - '^VerDate '
    - '^§\s*\d+\.\d+$'                                           # bare section number = running head
  min_page_chars: 30                  # pages with less text are logged as scanned/empty and skipped
  unreadable_placeholder: "[수식]"     # replaces runs of undecodable equation glyphs (HWP equation font)

chunking:
  tokenizer: BAAI/bge-reranker-v2-m3  # chunk sizes are counted with the reranker's tokenizer
  max_tokens: 500                     # longer clauses are split at sub-items, then into windows
  overlap_tokens: 50                  # overlap between windows of one long clause
  min_chars: 20                       # drop near-empty chunks (e.g. a heading with no text)
  toc_min_leader_lines: 3             # pages with this many "······" lines are tables of contents: skipped
  toc_min_leader_share: 0.5           # ... and at least this share of their lines (real TOCs: 0.75-1.0; CFR tables: 0.03)
  doc_types:                          # doc_id prefix -> clause rules (unknown prefixes use "booklet")
    KOSHA-: kosha
    KR-RULE-: kr_law
    KR-ACT-: kr_law
    KR-NOTICE-: kr_law
    CFR-: cfr
    OSHA-: booklet

index:
  passage_header: true                # index "title | law part/chapter | clause heading" + chunk text

retrieval:
  default_setup: F                    # E + the agent's search plan (2026-10-14); E was best before the planner
  setups:                             # ablation (Phase 3): A=BM25, B=dense, C=hybrid, D=hybrid+rerank
    A: {bm25: true,  dense: false, rerank: false}
    B: {bm25: false, dense: true,  rerank: false}
    C: {bm25: true,  dense: true,  rerank: false}
    D: {bm25: true,  dense: true,  rerank: true}
    E: {bm25: true,  dense: true,  rerank: true, translate: true}   # D + question translated to the other language
    F: {bm25: true,  dense: true,  rerank: true, planner: true}     # D + planner queries (KO + EN, documents' words) + country filter
  query_translation:
    model: null                       # null = same as llm.model
    thinking_level: low               # translation needs little reasoning ("minimal" is not supported by gemini-3.8-flash)
  bm25_top_k: 50
  dense_top_k: 50
  rrf_k: 60                           # RRF constant: score = sum 1/(rrf_k + rank)
  rerank_candidates: 10               # laptop CPU: ~1.8 s per candidate at 8 threads (20 -> 28 s, 10 -> 18 s per question)
  rerank_min_per_list: 3              # top N of BM25 and of dense always reach the reranker (helps cross-language)
  final_k: 5                          # evidence passages given to the LLM

reranker:
  model: BAAI/bge-reranker-v2-m3
  max_length: 512                     # tokens per (question, passage) pair; chunks are <= 500. 256 halves the time but cuts long clauses
  batch_size: 8
  device: cpu
  num_threads: 0                      # CPU threads for PyTorch; 0 = all (PyTorch's default uses only half)

answer:
  min_rerank_score:                   # refuse without calling the LLM if the best reranker score is below this
    E: 0.15                           # tuned on dev (2026-10-13): answerable min 0.367, unanswerable max 0.075
    F: 0.15                           # same as E (F reranks the same way); not re-tuned
    D: 0.01                           # D scores cross-language pairs very low (0.02 for a correct passage)
    default: 0.0
  snippet_chars: 160                  # length of the source snippet shown under an answer

evaluate:
  answer_setups: [C, D, E, F]         # LLM answers only for these setups (cost); retrieval metrics for all
  k_eval: 10                          # retrieve this many per question for MRR@10

web:                                  # SafetyAgent web app (python -m app.server)
  host: 127.0.0.1                     # localhost only: not reachable from other machines
  port: 8000
  db_path: data/app/docagent.sqlite   # chats, reviews, settings (git-ignored)
  admin_credentials: secrets/admin_credentials.json   # password hash only; create with: python -m app.auth
  page_cache_dir: cache/pages         # rendered PDF pages (PNG)
  page_zoom: 2.0                      # rendering scale (2 = sharp on high-DPI screens)
  default_user_setup: F               # search setup for users until the admin changes it
  max_chats_per_user: 50              # oldest chat is deleted when a browser creates the 51st
  max_turns_per_chat: 50              # questions per chat
  max_question_chars: 1000
  history_turns: 3                    # earlier exchanges used to rewrite a follow-up question
  admin_session_hours: 8

agent:                                # SafetyAgent (src/plant_rag/agent.py)
  compare_per_language: 3             # Korea vs US: best 3 Korean + best 3 English passages

visuals:
  max_output_tokens: 4096
  thinking_level: null                # null = llm default
  min_elements: 2                     # fewer checked elements -> no visual (the text answer stays)

api_key:
  env_var: GEMINI_API_KEY             # takes priority if set
  file: secrets/gemini_api_key.txt    # never printed, logged or committed

llm:
  model: gemini-3.8-flash             # gemini-2.5-flash is closed to new keys; list models: python -m plant_rag.smoke_test --list-models
  temperature: 0.0
  max_output_tokens: 8192             # includes "thinking" tokens; 2048 truncated 3 of 251 answers (thinking used ~1,900)
  thinking_level: null                # null = model default; or low / medium / high (less = faster, cheaper; minimal not supported)

embedding:
  model: gemini-embedding-001
  output_dim: 768                     # smaller than the default 3072; vectors are L2-normalized in code
  batch_size: 50                      # texts per API request (keep <= 100)

api:
  timeout_s: 60                       # per request
  max_retries: 5                      # on 429 / 5xx / network errors
  backoff_base_s: 2.0                 # wait = base * 2^attempt (+ jitter), capped below
  backoff_max_s: 60.0
  min_interval_s: 0.5                 # minimum gap between any two API calls
