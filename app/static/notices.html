<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="notices.pageTitle">SafetyAgent · Safety notices</title>
<link rel="icon" href="/brand/safetyagent_icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/static/css/safetyagent.css">
<link rel="stylesheet" href="/static/css/notice.css">
<style>
  body { display: grid; grid-template-columns: 280px 1fr 300px; height: 100vh; overflow: hidden; }
  .side, .checks { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .checks { border-right: none; border-left: 1px solid var(--line); overflow: auto; padding: 18px; gap: 16px; }
  .side-top { padding: 18px 16px 12px; display: grid; gap: 12px; }
  .side-top a.home { display: flex; gap: 10px; align-items: center; font-weight: 800; color: var(--brand); letter-spacing: .06em; }
  .side-top a.home img { width: 34px; height: 34px; }
  .side-top a.home:hover { text-decoration: none; }
  .newbox { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
  .newbox textarea { resize: vertical; min-height: 64px; }
  .newbox .row { display: flex; gap: 8px; }
  .newbox select { flex: 1; }
  .list-label { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 10px 18px 6px; }
  .list { overflow: auto; padding: 0 8px 12px; flex: 1; }
  .item { padding: 10px; border-radius: 10px; cursor: pointer; display: grid; gap: 4px; }
  .item:hover { background: var(--bg); } .item.active { background: var(--brand-50); }
  .item .t { font-weight: 600; font-size: 14px; } .item .m { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); }
  .back { font-size: 13px; padding: 10px 18px 14px; border-top: 1px solid var(--line); }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .toolbar { display: flex; gap: 10px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
  .toolbar .ttl { font-weight: 800; font-size: 16px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toolbar .sp { flex: 1; }
  .toolbar select { width: auto; padding: 6px 10px; font-size: 13px; }
  .preview { flex: 1; overflow: auto; padding: 28px 20px 60px; background: var(--bg); }
  .stage-box { margin: 0 auto; transform-origin: top left; }
  .empty-main { margin: 14vh auto; text-align: center; color: var(--ink-2); max-width: 420px; }
  .empty-main .big { font-size: 46px; }
  .checks h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .checks .box { border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 13.5px; display: grid; gap: 6px; }
  .checks .okline { color: var(--ok); font-weight: 600; } .checks .warnline { color: var(--warn); font-weight: 600; }
  .checks .src { cursor: pointer; } .checks .src:hover { color: var(--brand); }
  .progress { display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
  .progress .spinner { display: inline-block; vertical-align: middle; margin-right: 6px; }
  .sharebox { display: grid; gap: 8px; justify-items: start; }
  .sharebox img { width: 120px; height: 120px; }
  .sharebox input { font-size: 12px; }
  @media (max-width: 1200px) { body { grid-template-columns: 250px 1fr; } .checks { display: none; } }
  @media print { body { display: block; height: auto; overflow: visible; } .preview { padding: 0; overflow: visible; background: #fff; }
                 .stage-box { transform: none !important; width: auto !important; height: auto !important; } }
</style>
</head>
<body>
<aside class="side no-print">
  <div class="side-top">
    <a class="home" href="/chat"><img src="/brand/safetyagent_icon.svg" alt="">SafetyAgent</a>
    <form class="newbox" id="newForm">
      <b class="small" data-i18n="notices.newTitle">New notice</b>
      <textarea class="input" id="topic" required data-i18n-attr="placeholder:notices.topicPh"
                placeholder="Topic, e.g. forklift safety in the warehouse"></textarea>
      <div class="row">
        <select class="input" id="newLang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select>
        <select class="input" id="newTpl" aria-label="Template"></select>
      </div>
      <button class="btn btn-primary btn-sm" type="submit" style="justify-content:center" data-i18n="notices.create">Draft notice</button>
      <div class="progress" id="newProgress" hidden></div>
    </form>
  </div>
  <div class="list-label" data-i18n="notices.mine">My notices</div>
  <div class="list" id="list"></div>
  <div class="back"><a href="/chat" data-i18n="notices.backChat">← Back to chat</a></div>
</aside>

<main>
  <div class="toolbar no-print" id="toolbar" hidden>
    <span class="ttl" id="tTitle"></span><span id="tStatus"></span>
    <span class="sp"></span>
    <select class="input" id="tTpl" aria-label="Template"></select>
    <select class="input" id="tLang2" aria-label="Second language"></select>
    <button class="btn btn-primary btn-sm" id="bSave" type="button" disabled data-i18n="notices.save">Save edits</button>
    <button class="btn btn-ghost btn-sm" id="bPrint" type="button" data-i18n="notices.print">Print / PDF</button>
    <button class="btn btn-ghost btn-sm" id="bPng" type="button" data-i18n="notices.png">Image</button>
    <button class="btn btn-ghost btn-sm" id="bDel" type="button" aria-label="Delete">🗑</button>
  </div>
  <div class="preview" id="preview">
    <div class="empty-main no-print" id="emptyMain"><div class="big">📄</div>
      <p data-i18n="notices.empty">Draft a notice from a topic on the left, or from any answer in the chat ("Make a notice"). You can edit the text,
        add a second language, print it or share it after an admin approves it.</p></div>
    <div class="stage-box" id="stageBox"></div>
  </div>
</main>

<aside class="checks no-print" id="checks" hidden></aside>

<script src="/static/js/common.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/notice.js"></script>
<script src="/static/js/notices.js"></script>
</body>
</html>
