<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafetyAgent · Admin</title>
<link rel="icon" href="/brand/safetyagent_icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/static/css/safetyagent.css">
<link rel="stylesheet" href="/static/css/notice.css">
<style>
  /* login */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px;
           background: radial-gradient(900px 420px at 80% -10%, var(--brand-50), transparent 65%), var(--bg); }
  .login .card { width: min(400px, 100%); padding: 32px; display: grid; gap: 14px; }
  .login h1 { font-size: 22px; } .login label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .err { color: var(--bad); font-size: 13.5px; min-height: 18px; }
  /* shell */
  .top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .top .in { max-width: 1280px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; gap: 26px; }
  .tabs { display: flex; gap: 4px; }
  .tab { border: none; background: none; padding: 8px 14px; border-radius: 999px; color: var(--ink-2); font-weight: 600; font-size: 14px; }
  .tab:hover { background: var(--bg); } .tab.active { background: var(--brand-50); color: var(--brand); }
  .top .right { margin-left: auto; display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--ink-2); }
  .account { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; border: 1px solid var(--line);
             border-radius: 999px; background: var(--surface); }
  .account .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: #fff; display: grid;
                     place-items: center; font-weight: 700; font-size: 13px; text-transform: uppercase; }
  .account .nm { font-weight: 700; color: var(--ink); line-height: 1.15; }
  .account .role { font-size: 11.5px; color: var(--ok); line-height: 1.15; }
  .account .role::before { content: "●"; margin-right: 4px; }
  .page-wrap { max-width: 1280px; margin: 0 auto; padding: 28px 24px 60px; }
  .h { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; } .h h2 { font-size: 22px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .tile { padding: 18px 20px; } .tile .n { font-size: 30px; font-weight: 800; color: var(--brand); } .tile .l { font-size: 13px; color: var(--ink-2); }
  /* answers */
  .split { display: grid; grid-template-columns: 380px 1fr; gap: 18px; align-items: start; }
  .list { padding: 8px; max-height: calc(100vh - 190px); overflow: auto; }
  .row { padding: 12px 12px; border-radius: 10px; cursor: pointer; display: grid; gap: 5px; border: 1px solid transparent; }
  .row:hover { background: var(--bg); } .row.active { background: var(--brand-50); border-color: var(--brand-100); }
  .row .q { font-weight: 600; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .m { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .detail { padding: 24px 26px; display: grid; gap: 18px; }
  .qbox { font-weight: 700; font-size: 17px; } .sub { font-size: 13px; color: var(--muted); }
  .section-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .review { display: grid; gap: 10px; padding: 16px; background: var(--bg); border-radius: var(--radius); }
  .verdicts { display: flex; gap: 8px; flex-wrap: wrap; }
  .verdict { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 13.5px; }
  .verdict.on.correct { background: var(--ok-50); border-color: var(--ok); color: var(--ok); }
  .verdict.on.partial { background: var(--warn-50); border-color: var(--warn); color: var(--warn); }
  .verdict.on.incorrect { background: var(--bad-50); border-color: var(--bad); color: var(--bad); }
  .ev { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 6px; }
  .ev.cited { border-color: var(--brand-100); background: #fbfcff; }
  .ev .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .ev .t { font-weight: 700; } .ev .txt { font-size: 13px; color: var(--ink-2); white-space: pre-wrap; max-height: 120px; overflow: hidden; }
  .ev.open .txt { max-height: none; }
  .ev .acts { display: flex; gap: 8px; }
  .score { font-variant-numeric: tabular-nums; }
  /* tables, forms */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  td { padding: 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
  .setup-opts { display: grid; gap: 10px; }
  .opt { display: grid; grid-template-columns: 22px 1fr auto; gap: 12px; align-items: center; padding: 16px 18px; border: 1px solid var(--line);
         border-radius: var(--radius); background: var(--surface); cursor: pointer; }
  .opt:hover { border-color: var(--brand-100); } .opt.sel { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-50); }
  .opt .nm { font-weight: 700; } .opt .ds { font-size: 13px; color: var(--ink-2); }
  .console { display: grid; grid-template-columns: 1fr 230px auto; gap: 10px; align-items: start; }
  @media (max-width: 980px) { .split, .tiles, .console { grid-template-columns: 1fr; } .tabs { overflow: auto; } }
</style>
</head>
<body data-ui-lang-fixed="en">
<div id="loginView" class="login" hidden>
  <form class="card" id="loginForm">
    <img class="logo" src="/brand/safetyagent_logo.svg" alt="SafetyAgent" style="height:50px">
    <h1>Admin sign in</h1>
    <div class="small muted">Settings, document review and answer quality checks.</div>
    <label for="u">Username</label><input class="input" id="u" autocomplete="username" required>
    <label for="p">Password</label><input class="input" id="p" type="password" autocomplete="current-password" required>
    <div class="err" id="loginErr"></div>
    <button class="btn btn-primary" type="submit" style="justify-content:center">Sign in</button>
    <a class="small" href="/">← Back to SafetyAgent</a>
  </form>
</div>

<div id="appView" hidden>
  <div class="top"><div class="in">
    <a href="/" aria-label="SafetyAgent home"><img class="logo logo-sm" src="/brand/safetyagent_logo.svg" alt="SafetyAgent"></a>
    <nav class="tabs" id="tabs">
      <button class="tab" data-tab="overview">Overview</button>
      <button class="tab" data-tab="answers">Answers</button>
      <button class="tab" data-tab="notices">Notices</button>
      <button class="tab" data-tab="console">Test console</button>
      <button class="tab" data-tab="docs">Documents</button>
      <button class="tab" data-tab="settings">Settings</button>
    </nav>
    <div class="right">
      <div class="account" title="You are signed in">
        <span class="avatar" id="avatar">A</span>
        <span><span class="nm" id="who"></span><br><span class="role">Signed in · Administrator</span></span>
      </div>
      <button class="btn btn-ghost btn-sm" id="logout" type="button">Sign out</button>
    </div>
  </div></div>
  <div class="page-wrap" id="content"></div>
</div>
<script src="/static/js/common.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/visuals.js"></script>
<script src="/static/js/notice.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
