<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafetyAgent · Notice</title>
<link rel="icon" href="/brand/safetyagent_icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/static/css/safetyagent.css">
<link rel="stylesheet" href="/static/css/notice.css">
<style>
  body { background: var(--bg); }
  .bar { display: flex; gap: 10px; align-items: center; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar a.home { display: flex; gap: 8px; align-items: center; font-weight: 800; color: var(--brand); letter-spacing: .05em; }
  .bar a.home img { width: 30px; height: 30px; } .bar a.home:hover { text-decoration: none; }
  .bar .sp { flex: 1; }
  .wrapv { padding: 24px 12px 60px; overflow-x: auto; }
  .msg { max-width: 460px; margin: 16vh auto; text-align: center; color: var(--ink-2); }
  .src-panel { max-width: 794px; margin: 18px auto 0; font-size: 13px; color: var(--ink-2); }
  .src-panel a { cursor: pointer; }
  @media print { .wrapv { padding: 0; } }
</style>
</head>
<body>
<div class="bar no-print">
  <a class="home" href="/"><img src="/brand/safetyagent_icon.svg" alt="">SafetyAgent</a>
  <span id="st"></span><span class="sp"></span>
  <button class="btn btn-ghost btn-sm" type="button" onclick="window.print()" data-i18n="notices.print">Print / PDF</button>
  <div class="seg ui-lang" role="group" aria-label="Interface language"><button type="button" data-ui-lang="en">EN</button><button type="button" data-ui-lang="ko">한국어</button></div>
</div>
<div class="wrapv" id="box"><div class="msg"><span class="spinner"></span></div></div>
<script src="/static/js/common.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/notice.js"></script>
<script>
  "use strict";
  const viewer = new DA.Viewer();
  const id = location.pathname.split("/").pop();
  let n = null;
  function draw() {
    const box = document.getElementById("box");
    if (!n) return;
    document.title = `SafetyAgent · ${n.title}`;
    document.getElementById("st").innerHTML = n.status === "approved"
      ? `<span class="chip ok">✓ ${DA.t("notices.approved")}</span>` : `<span class="chip warn">${DA.t("notices.draft")}</span>`;
    const P = Object.values(n.passages || {});
    box.innerHTML = DA.Notice.render(n, { editable: false }) + `<div class="src-panel no-print"><b>${DA.t("notices.cSources")}</b> ·
      ${P.map((p) => `<a data-chunk="${p.chunk_id}">[${p.n}] ${DA.esc(p.clause_id)}</a>`).join(" · ")}</div>`;
    box.querySelectorAll("[data-chunk]").forEach((a) => { a.onclick = () => viewer.open({ chunk_id: a.dataset.chunk }); });
  }
  DA.api(`/api/notices/${encodeURIComponent(id)}`).then((d) => { n = d; draw(); })
    .catch(() => { document.getElementById("box").innerHTML = `<div class="msg">${DA.t("notices.unavailable")}</div>`; });
  document.addEventListener("da:lang", draw);
</script>
</body>
</html>
